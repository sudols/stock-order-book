services:
  - type: web
    name: orderbook-server
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd packages/server && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Auth configs
      - key: BOT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Turnstile configs
      - key: TURNSTILE_SECRET_KEY
        sync: false
